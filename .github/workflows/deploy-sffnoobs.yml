name: Deploy to sffnoobs environment on push to main

on:
  push:
    branches: [ master ]
    paths:
      - 'force-app/**'

jobs:
  Deploy-to-sffnoobs-environment:
      runs-on: ubuntu-latest
      environment: sffnoobs
      steps:
          - uses: actions/setup-node@v3
            with:
              node-version: '18'
          - name: 'Checkout source code'
            uses: actions/checkout@v3
            with:
              fetch-depth: 0
                
          # Now Install Salesforce CLI
          - name: 'Install sfdx'
            run: npm install @salesforce/cli --global
          - name: 'Installing sfdx git delta'
            run: | 
                echo Y | sfdx plugins:install sfdx-git-delta
                sfdx plugins

          - name: 'Create delta packages'
            run: | 
                mkdir changed-sources
                sf sgd source delta --to "HEAD" --from "HEAD~1" --output changed-sources/ --generate-delta --source force-app/
                echo "[INFO] Diff generated"
                
          - name: 'Deploy to environment with running all local tests'
            run: |
                # write secret safely (no trailing newlines)
                printf '%s' "${{ secrets.SALESFORCE_AUTH_URL }}" > auth.txt
                # sanity check: ensure auth file is not empty
                if [ ! -s auth.txt ]; then
                  echo "ERROR: SALESFORCE_AUTH_URL secret is empty or missing"
                  exit 1
                fi
                echo "Auth file size (bytes):" $(wc -c < auth.txt)
                # show CLI version for debugging
                sf --version || true
                # attempt login using the provided SFDX URL
                sf org login sfdx-url --sfdx-url-file auth.txt --alias deploy-org --set-default
                # list authenticated orgs to verify login
                sf org list
                # deploy the generated delta
                sf project deploy start --source-dir changed-sources/force-app --test-level RunLocalTests
                rm auth.txt