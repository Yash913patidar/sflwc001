<template>
    <lightning-card title="JPEG to PDF Manager">
        <div class="slds-p-around_medium">

            <!-- Upload Images -->
            <lightning-input
                type="file"
                label="Upload JPG Images"
                accept=".jpg,.jpeg"
                multiple
                onchange={handleUpload}>
            </lightning-input>

            <!-- Saved Images List -->
            <template if:true={files.length}>
                <h3 class="slds-m-top_medium slds-text-heading_small">
                    Saved JPEG Files
                </h3>

                <template for:each={files} for:item="file">
                    <div
                        key={file.Id}
                        class="slds-box slds-m-top_small slds-grid slds-align_absolute-center">

                        <lightning-input
                            type="checkbox"
                            label={file.Title}
                            data-id={file.Id}
                            onchange={toggleSelection}>
                        </lightning-input>

                    </div>
                </template>
            </template>

            <!-- Action Buttons -->
            <div class="slds-m-top_medium">
                <lightning-button
                    label="Download PDF"
                    variant="brand"
                    onclick={downloadPdf}
                    disabled={disableActions}>
                </lightning-button>

                <lightning-button
                    label="Save PDF to Files"
                    variant="neutral"
                    onclick={savePdfToFiles}
                    disabled={disableActions}
                    class="slds-m-left_small">
                </lightning-button>

                <lightning-button
                    label="Delete Selected Images"
                    variant="destructive"
                    onclick={deleteSelected}
                    disabled={disableActions}
                    class="slds-m-left_small">
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
