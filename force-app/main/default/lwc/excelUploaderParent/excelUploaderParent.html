<template>
    <lightning-card title="Excel Contact Importer">

        <!-- File Selector -->
        <div class="slds-p-around_medium">
            <lightning-input
                type="file"
                label="Select Excel File"
                accept=".xlsx"
                onchange={handleFileChange}>
            </lightning-input>
        </div>

        <!-- Progress Bar Child -->
        <c-progress-bar-child progress={progress}></c-progress-bar-child>


        <!-- Status -->
        <div class="slds-p-around_medium">
            <p>{statusMessage}</p>
        </div>

        <!-- Save Button -->
        <div class="slds-p-around_medium">
            <lightning-button
                label="Save"
                variant="brand"
                disabled={isSaveDisabled}
                onclick={handleSave}>
            </lightning-button>
        </div>

    </lightning-card>
</template>
